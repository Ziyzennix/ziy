# Ziy application manifest.
#
# This file makes a plain Firefox install tree run as an independent product
# named Ziy. It is read by libxul's XULAppInfo (see the "Error: App:Name not
# specified in application.ini" strings inside libxul.so) and is what makes
# `--appDir` point at our directory instead of a Mozilla-shipped app id.
#
# The ID below is a freshly generated UUID of our own (not Mozilla's
# {ec8030f7-...}) so Ziy can never be mistaken for Firefox by remote
# services, telemetry servers or about:support.

[App]
Vendor=Ziy
Name=Ziy
RemotingName=ziy
Version=156.0.1
BuildID=20260921121718
ID={3B4A3FF9-795A-4559-A616-4989CEBD8170}

[Gecko]
MinVersion=156.0.1
MaxVersion=156.0.1

[XRE]
EnableProfileMigrator=1

[Crash Reporter]
# Our app dir owns crash reporting: no pings leave the box for Ziy. The URL is
# retained syntactically because libxul's crash-reporter code reads it, but
# the datareporting/telemetry prefs that would ever submit it are locked off
# in mozilla.cfg, so the reporter cannot upload anything.
Enabled=0
ServerURL=

[AppUpdate]
# Ziy is updated by tools/update-engine.sh against a Firefox the operator has
# already vetted (see architecture.md §1.4/§8). Pointing at Mozilla's AUS would
# overwrite our patched omni.ja with an unpatched one.
URL=
