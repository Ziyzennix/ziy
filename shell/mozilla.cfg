// Ziy — autoconfig script.
//
// Read at startup by nsAutoConfig because browser/defaults/preferences/ziy.js
// sets:
//     pref("general.config.obscure_value", 0);
//     pref("general.config.filename", "mozilla.cfg");
// The file must live at the GRE root (the same directory as the `firefox`
// binary) and be world-readable — that is the documented mechanism, and it is
// the one the engine implements (see defaults/autoconfig/prefcalls.js inside
// omni.ja for the definition of the helper functions used below).
//
// The helpers available here are: pref, defaultPref, lockPref, unlockPref,
// getPref, clearPref, getenv, displayError.
//
// This file is the second of the three configuration layers, in load order:
//   browser/defaults/preferences/ziy.js        (user-changeable defaults)
//   browser/defaults/preferences/ziy-hardening.js (same defaults, no locks)
//   THIS FILE                                  (the locks)
// / distribution/policies.json                 (enterprise-shaped settings)
//
// Everything here is a lock. Anything a user is allowed to change belongs in
// ziy.js instead. tools/verify.sh checks that the two files agree on the
// hardening set.

// ---------------------------------------------------------------------------
// 0. Guard: refuse to run lockPref against a config file we did not ship.
// ---------------------------------------------------------------------------
// If someone copies this app dir around, the lock set is still ours. We do not
// attempt to re-detect the app id at runtime; the whole app dir is the unit we
// sign off on in the build.

// ---------------------------------------------------------------------------
// 1. Fingerprint resistance — locked
// ---------------------------------------------------------------------------
lockPref("privacy.resistFingerprinting", true);
lockPref("privacy.resistFingerprinting.letterboxing", true);
lockPref("privacy.resistFingerprinting.randomizationOnRestart", true);
lockPref("privacy.resistFingerprinting.pbmode", true);
lockPref("privacy.fingerprintingProtection.enabled", true);
lockPref("privacy.fingerprintingProtection.pbmode", true);
// This one takes the RFP target STRING, e.g. "+AllTargets,-CSSPrefersColorScheme".
lockPref("privacy.fingerprintingProtection.overrides", "+AllTargets,-CSSPrefersColorScheme");
// This one takes a JSON ARRAY of {firstPartyDomain, overrides} objects — a bare
// string makes FingerprintingWebCompatService's JSON.parse throw, which aborts
// autoconfig and half-configures the engine. See the note in ziy.js.
lockPref("privacy.fingerprintingProtection.granularOverrides",
         "[{\"firstPartyDomain\":\"*\",\"overrides\":\"+AllTargets,-CSSPrefersColorScheme\"}]");
lockPref("gfx.canvas.serialization.readback", false);
lockPref("gfx.canvas.hit-region", false);
// WebGL unmasked renderer/vendor strings. The engine's real pref names are
// webgl.override-unmasked-renderer / webgl.override-unmasked-vendor
// (modules/libpref/init/StaticPrefList.yaml:20403 and :20408) — NOT the
// webgl.renderer-string-override / webgl.vendor-string-override names this file
// used to carry, which the engine never reads. Do not re-add the old names.
lockPref("webgl.override-unmasked-renderer", "Mozilla");
lockPref("webgl.override-unmasked-vendor", "Mozilla");

// ---------------------------------------------------------------------------
// 2. Disabled platform APIs — locked
// ---------------------------------------------------------------------------
lockPref("dom.battery.enabled", false);
// dom.serial.enabled was a typo for the engine's real name: dom.webserial.enabled
// (StaticPrefList.yaml:6205, gated at dom/webidl/Navigator.webidl:254 and
// Serial.webidl:22). Do not re-add the old name `dom.serial.enabled`.
lockPref("dom.webserial.enabled", false);
// dom.webbluetooth.enabled — API not implemented in Gecko 156.0.1: there is no
// dom/webidl/Bluetooth*.webidl interface file (the name appears only in the
// InstrumentedProps phantom list at dom/webidl/Window.webidl:37-44), so there is
// no pref to lock. Do not re-add this line.
// dom.nfc.enabled — API not implemented in Gecko 156.0.1: no NDEFReader or NFC
// interface anywhere in dom/webidl/. Do not re-add this line.
// dom.idle-detector.enabled — API not implemented in Gecko 156.0.1: no
// IdleDetector interface anywhere in dom/webidl/. Do not re-add this line.
// dom.filesystem.enabled was the wrong name; the engine reads dom.fs.enabled
// (StaticPrefList.yaml:5384, gated at FileSystemHandle.webidl:10 and friends).
// Do not re-add the old name `dom.filesystem.enabled`.
lockPref("dom.fs.enabled", false);
lockPref("dom.netinfo.enabled", false);
lockPref("dom.event.contextmenu.enabled", false);
lockPref("dom.gamepad.enabled", false);
lockPref("dom.vibrator.enabled", false);
lockPref("dom.push.connection.enabled", false);
// Motion sensors. This is the one recon-listed device API that IS implemented in
// Gecko 156 AND was not disabled: device.sensors.enabled is read by
// DeviceSensorsEnabled() at dom/base/nsGlobalWindowInner.cpp:3622-3635, and that
// one function gates all four sensor event interfaces at once
// (DeviceMotionEvent.webidl:24, DeviceOrientationEvent.webidl:6,
// DeviceLightEvent.webidl:6, UserProximityEvent.webidl:6).
lockPref("device.sensors.enabled", false);

// ---------------------------------------------------------------------------
// 3. WebRTC identity surfaces — locked
// ---------------------------------------------------------------------------
lockPref("media.peerconnection.ice.no_host", true);
lockPref("media.peerconnection.ice.default_address_only", true);
lockPref("media.peerconnection.identity.enabled", false);
lockPref("media.navigator.enabled", false);
lockPref("media.webspeech.recognition.enable", false);
lockPref("media.webspeech.synth.enabled", false);

// ---------------------------------------------------------------------------
// 4. Network privacy — locked
// ---------------------------------------------------------------------------
lockPref("network.dns.disablePrefetch", true);
lockPref("network.dns.disablePrefetchFromHTTPS", true);
lockPref("network.predictor.enabled", false);
lockPref("network.captive-portal-service.enabled", false);
lockPref("network.dns.echconfig.enabled", false);
lockPref("network.trr.mode", 5);
lockPref("network.http.sendRefererHeader", 2);
lockPref("network.http.referer.XOriginPolicy", 1);
lockPref("network.http.sendSecureXSiteReferrer", false);
lockPref("dom.security.https_only_mode", true);

// ---------------------------------------------------------------------------
// 5. Telemetry / studies / error noise — locked off
// ---------------------------------------------------------------------------
lockPref("datareporting.healthreport.uploadEnabled", false);
lockPref("datareporting.policy.dataSubmissionEnabled", false);
lockPref("datareporting.policy.firstRunTime", 0);
lockPref("datareporting.usage.uploadEnabled", false);
lockPref("toolkit.telemetry.enabled", false);
lockPref("toolkit.telemetry.unified", false);
lockPref("toolkit.telemetry.archive.enabled", false);
lockPref("toolkit.telemetry.server", "");
lockPref("toolkit.telemetry.cachedClientID", "");
lockPref("toolkit.telemetry.newProfilePing.enabled", false);
lockPref("toolkit.telemetry.shutdownPingSender.enabled", false);
lockPref("toolkit.telemetry.firstShutdownPing.enabled", false);
lockPref("toolkit.telemetry.bhrPing.enabled", false);
lockPref("toolkit.telemetry.reportingpolicy.firstRun", false);
lockPref("app.normandy.enabled", false);
lockPref("app.normandy.first-run", false);
lockPref("app.shield.optoutstudies.enabled", false);
lockPref("browser.ping-centre.telemetry", false);
lockPref("browser.discovery.enabled", false);
lockPref("browser.safebrowsing.reportPhishURL", "");
lockPref("browser.safebrowsing.reportMalwareURL", "");
lockPref("browser.safebrowsing.blockedURIs.enabled", false);
lockPref("browser.chrome.errorReporter.enabled", false);
lockPref("security.ssl.errorReporting.enabled", false);
lockPref("security.ssl.errorReporting.url", "");

// ---------------------------------------------------------------------------
// 6. Firefox Accounts / Mozilla sync — locked off (ziy-sync only)
// ---------------------------------------------------------------------------
lockPref("identity.fxaccounts.enabled", false);
lockPref("identity.fxaccounts.toolbar.enabled", false);

// ---------------------------------------------------------------------------
// 7. Pocket and other Mozilla surfaces we do not ship — locked off
// ---------------------------------------------------------------------------
lockPref("extensions.pocket.enabled", false);
lockPref("extensions.pocket.api", "");
lockPref("browser.topsites.contile.enabled", false);
lockPref("browser.newtabpage.activity-stream.showSponsored", false);
lockPref("browser.newtabpage.activity-stream.showSponsoredTopSites", false);
lockPref("browser.newtabpage.activity-stream.feeds.section.topstories", false);
lockPref("browser.newtabpage.activity-stream.feeds.snippets", false);
// The engine's own new tab page is the built-in newtab@mozilla.org add-on.
// These two locks are the pref layer of the strip (the byte layer is the
// browser/omni.ja manifest_version patch in build-shell.sh §7b):
//   browser.newtabpage.enabled=false — AboutNewTabRedirector routes about:newtab
//     to the chrome_url_overrides.newtab extension (ziy-ntp), not the built-in.
//   browser.newtabpage.disableNewTabAsAddon=true — AboutNewTabResourceMapping
//     stops mapping the built-in's resources entirely.
// Both are locked so nothing in the profile (or a Nimbus emergency flip) can
// bring Mozilla's new tab back without rebuilding Ziy.
lockPref("browser.newtabpage.enabled", false);
lockPref("browser.newtabpage.disableNewTabAsAddon", true);
lockPref("browser.newtabpage.activity-stream.selfLoading.enabled", false);
lockPref("browser.startup.homepage.abouthome_cache.enabled", false);

// ---------------------------------------------------------------------------
// 8. Add-on signing and sideload — the Ziy install-our-own-suite path
// ---------------------------------------------------------------------------
// MOZ_REQUIRE_SIGNING inside omni.ja is already false (the patched constant),
// which unlocks the xpinstall.signatures.required policy prefix. Locking it
// again here is belt and braces: this is the pref AddonSettings.sys.mjs reads
// when deciding whether an unsigned xpi in distribution/extensions/ may be
// installed for the app scope.
lockPref("xpinstall.signatures.required", false);
lockPref("xpinstall.whitelist.required", false);
// Scope bitmap: profile(1) | user(4) | system(8) | app(16). 15 lets Ziy's own
// distribution addons plus the profile's sideload directory both work.
lockPref("extensions.autoDisableScopes", 0);
lockPref("extensions.installDistroAddons", true);
lockPref("extensions.sideloadScopes", 15);
lockPref("extensions.enabledScopes", 15);
lockPref("extensions.allowPrivateBrowsingByDefault", true);

// ---------------------------------------------------------------------------
// 9. Tracking protection / cookies — locked
// ---------------------------------------------------------------------------
lockPref("privacy.trackingprotection.enabled", true);
lockPref("privacy.trackingprotection.pbmode.enabled", true);
lockPref("privacy.trackingprotection.cryptomining.enabled", true);
lockPref("privacy.trackingprotection.fingerprinting.enabled", true);
lockPref("privacy.trackingprotection.emailtracking.enabled", true);
lockPref("privacy.trackingprotection.socialtracking.enabled", true);
lockPref("network.cookie.cookieBehavior", 5);
// network.cookie.lifetimePolicy — REMOVED: no such pref exists in the engine
// (0 occurrences in modules/libpref/init/StaticPrefList.yaml and all.js). It was
// a no-op lock. The engine's cookie-age control is network.cookie.maxageCap;
// do not re-add `network.cookie.lifetimePolicy`.
// privacy.partition.network_state.ocsp_cache / .cookie_cache and
// privacy.partition.serviceWorkers — REMOVED: none of these three exist either.
// The only privacy.partition.* prefs the engine registers are
// privacy.partition.bloburl_per_partition_key and
// privacy.partition.network_state.connection_with_proxy (StaticPrefList.yaml:18269,
// :18281). Network-state partitioning itself is already fully on via
// network.cookie.cookieBehavior=5 (BEHAVIOR_PARTITION_FOREIGN, netwerk/cookie/
// nsICookieService.idl:75-81). Do not re-add any of the three names.
// See replica/proofs-cpp-privacy.md §2.1 and §2.5 for the full dead-pref hunt.

// ---------------------------------------------------------------------------
// 10. Ziy identity — locked, so nothing can rename the product mid-run
// ---------------------------------------------------------------------------
lockPref("ziy.app.name", "Ziy");
lockPref("ziy.app.version", "156.0.1");
lockPref("browser.startup.homepage", "about:newtab");
lockPref("startup.homepage_welcome_url", "");
lockPref("startup.homepage_override_url", "");

// ---------------------------------------------------------------------------
// 11. Feature flags the shell reads
// ---------------------------------------------------------------------------
lockPref("ziy.shields.enabled", true);
lockPref("ziy.ntp.widgets.clock", "24");
