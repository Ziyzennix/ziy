<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="context-fill" fill-opacity="context-fill-opacity" role="img" aria-label="Ziy mark: a sealed shield"><title>Ziy mark — sealed shield</title><!-- Original Ziy design: a shield whose face is a sealed (closed) eye, drawn from straight chords on a 16-unit grid. No other product's mark, silhouette or palette. Gloam teal by default; -moz-context-properties lets the toolbar fill it with the text colour, which is why the body carries no hard-coded fill. --><path d="M8 .6 14 2.6v4.9c0 3.4-2.6 5.8-6 6.9-3.4-1.1-6-3.5-6-6.9V2.6L8 .6Z"/><path d="M8 2.4 3.8 3.8v3.7c0 2.4 1.8 4.2 4.2 5.1 2.4-.9 4.2-2.7 4.2-5.1V3.8L8 2.4Z" fill="none" stroke="#ffffff" stroke-opacity=".45" stroke-width=".9"/><path d="M4.5 7.2c1.2-1.2 2.4-1.2 3.5 0 1.1-1.2 2.3-1.2 3.5 0" fill="none" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round"/><circle cx="8" cy="6.1" r=".9" fill="#ffffff"/></svg>
