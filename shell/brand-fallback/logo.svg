<?xml version="1.0" encoding="UTF-8"?>
<!--
  Ziy mark — shield + lion silhouette, our own design (replica/architecture.md §2:
  "a lion/shield family of marks ... reads as 'protected' rather than 'copied'").

  This is the SHELL's fallback mark, not the brand: brand/ is produced by the
  design worker and will land as brand/logo.svg, brand/logo-48.png, brand/
  logo-96.png and brand/wordmark.svg. build-shell.sh prefers brand/ when it
  exists and falls back to this file when it does not, so the shell slice builds
  and boots with a real icon either way. Simple geometry, no assets traced from
  anything.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="ziy-shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4C2EFF"/>
      <stop offset="100%" stop-color="#26118F"/>
    </linearGradient>
  </defs>

  <!-- Shield: rounded top, tapering to a point. -->
  <path d="M48 4 L88 18 V48 C88 70 71 84 48 92 C25 84 12 70 12 48 V18 Z"
        fill="url(#ziy-shield)" stroke="#0E0630" stroke-width="3"
        stroke-linejoin="round"/>

  <!-- Inner bevel. -->
  <path d="M48 12 L80 23 V48 C80 66 66 77 48 84 C30 77 20 66 20 48 V23 Z"
        fill="none" stroke="#6C55FF" stroke-width="2" opacity="0.55"/>

  <!-- Lion: head-in-profile glyph built from a circle (head), a triangular mane
       and a wedge (ear). Stylised, geometric, clearly not a traced logo. -->
  <g fill="#FF6B35">
    <circle cx="46" cy="50" r="15"/>
    <path d="M46 30 L34 20 L44 34 Z"/>
    <path d="M60 42 L74 34 L62 50 Z"/>
    <path d="M32 44 L20 38 L30 52 Z"/>
  </g>
  <!-- Eyes and muzzle so it reads as a face at 16px. -->
  <g fill="#0E0630">
    <circle cx="41" cy="47" r="2.4"/>
    <circle cx="51" cy="47" r="2.4"/>
    <path d="M43 56 Q46 59 49 56 Z"/>
  </g>
</svg>
