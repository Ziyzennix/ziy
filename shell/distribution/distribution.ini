; Ziy distribution descriptor.
;
; Read from the GRE root's distribution/ directory by modules/distribution.sys.mjs.
; On Linux that is <install-dir>/distribution/, which is where build-shell.sh
; copies this file.
;
; The [Global] id/about pair is what shows up in about:support's
; "Distributor ID"/"Description" rows (the strings exist in libxul.so), and the
; [Preferences] block is applied through the same pref service as everything
; else, before policies.json runs.

[Global]
; Short, unique id for this distribution. Not Mozilla's partner ids.
id=ziy
version=1.0
about=Ziy Browser
about.en-US=Ziy Browser
; Our own partner attribution. Firefox reads these into the prefs below so
; about:support can name the distribution.
bookmarks.initialized.pref=ziy.distribution.bookmarks.initialized

[Preferences]
; Identify the distribution: this is what about:support shows and what
; distribution.iniFile.exists.* keys in prefs.js are derived from.
mozilla.partner.id="ziy"
app.distributor="ziy"
app.distributor.channel=
browser.search.distributionID="ziy"

; Ziy does not ship Mozilla partner bookmarks: ziy-shell builds its own
; first-run experience. Set the initializer marker so the engine does not
; create any.
browser.bookmarks.addDefaultBookmarks=false
ziy.distribution.bookmarks.initialized=true

; The default engine is Google, named exactly as the engine's own engine list
; spells it so the pref resolves to a real engine rather than a dead name.
; Google is an entry in Ziy's own engine catalog too (the NTP's fallback list,
; the welcome page's first radio, the options page) — it is the default, not
; the only choice. Every other engine stays selectable everywhere.
browser.search.defaultenginename="Google"
browser.search.region="US"
browser.search.isUS=false
browser.search.hiddenOneOffs=""

; Keep the welcome/first-run pages entirely ours.
startup.homepage_welcome_url=""
startup.homepage_override_url=""
